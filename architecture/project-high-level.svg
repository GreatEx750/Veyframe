<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
  <title id="title">Veyframe project overview</title>
  <desc id="desc">A high-level flow from a website and creative brief through grounded planning, production, and delivery in four steps.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3154D5"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#18306A" flood-opacity="0.10"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#DDE4F2" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="2560" height="1440" fill="#F8FAFD"/>
  <rect width="2560" height="1440" fill="url(#grid)"/>

  <g transform="translate(128 102)">
    <g aria-label="Veyframe logo">
      <circle cx="42" cy="42" r="42" fill="#FFFFFF" stroke="#D9E0EE" stroke-width="2"/>
      <path d="M20 24L42 66L64 24H52L42 44L32 24Z" fill="#3154D5"/>
      <path d="M42 44L52 24H68L48 62Z" fill="#FF6666"/>
    </g>
    <text x="112" y="31" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4" fill="#3154D5">VEYFRAME</text>
    <text x="112" y="71" font-family="Inter, Arial, sans-serif" font-size="23" fill="#5D687D">PROJECT OVERVIEW</text>
  </g>

  <text x="128" y="310" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2.5" fill="#121B2D">From product URL to polished story</text>
  <text x="128" y="372" font-family="Inter, Arial, sans-serif" font-size="28" fill="#5D687D">One brief becomes grounded direction, authentic product footage, and a finished video.</text>

  <g filter="url(#soft)">
    <rect x="128" y="492" width="512" height="604" rx="18" fill="#FFFFFF" stroke="#CBD5E7" stroke-width="2"/>
    <rect x="704" y="492" width="512" height="604" rx="18" fill="#FFFFFF" stroke="#CBD5E7" stroke-width="2"/>
    <rect x="1280" y="492" width="512" height="604" rx="18" fill="#FFFFFF" stroke="#CBD5E7" stroke-width="2"/>
    <rect x="1856" y="492" width="576" height="604" rx="18" fill="#FFFFFF" stroke="#CBD5E7" stroke-width="2"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(176 542)">
      <text font-size="20" font-weight="700" letter-spacing="3" fill="#3154D5">01  BRIEF</text>
      <circle cx="70" cy="148" r="62" fill="#EEF2FF"/>
      <path d="M42 118H94C101 118 106 123 106 130V176C106 183 101 188 94 188H42C35 188 30 183 30 176V130C30 123 35 118 42 118Z" fill="none" stroke="#3154D5" stroke-width="6"/>
      <path d="M45 140H91M45 158H82" stroke="#3154D5" stroke-width="6" stroke-linecap="round"/>
      <circle cx="106" cy="111" r="20" fill="#FF6666"/>
      <path d="M98 111H114M106 103V119" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <text y="270" font-size="38" font-weight="700" fill="#121B2D">Describe the story</text>
      <text y="319" font-size="23" fill="#5D687D">Website URL, audience, goal,</text>
      <text y="354" font-size="23" fill="#5D687D">tone, format, and call to action.</text>
      <line x1="0" y1="404" x2="416" y2="404" stroke="#DCE3EF" stroke-width="2"/>
      <text y="452" font-size="19" font-weight="700" letter-spacing="2" fill="#7A8496">USER INPUT</text>
      <text y="493" font-size="22" fill="#121B2D">One clear creative brief</text>
    </g>

    <g transform="translate(752 542)">
      <text font-size="20" font-weight="700" letter-spacing="3" fill="#3154D5">02  UNDERSTAND</text>
      <circle cx="70" cy="148" r="62" fill="#EEF2FF"/>
      <circle cx="70" cy="148" r="33" fill="none" stroke="#3154D5" stroke-width="6"/>
      <path d="M70 104V119M70 177V192M26 148H41M99 148H114M39 117L50 128M90 168L101 179M39 179L50 168M90 128L101 117" stroke="#3154D5" stroke-width="6" stroke-linecap="round"/>
      <circle cx="111" cy="108" r="18" fill="#34A853"/>
      <path d="M103 108L109 114L120 102" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="270" font-size="38" font-weight="700" fill="#121B2D">Ground the plan</text>
      <text y="319" font-size="23" fill="#5D687D">Inspect the site, retrieve public</text>
      <text y="354" font-size="23" fill="#5D687D">context, and build a typed script.</text>
      <line x1="0" y1="404" x2="416" y2="404" stroke="#DCE3EF" stroke-width="2"/>
      <text y="452" font-size="19" font-weight="700" letter-spacing="2" fill="#7A8496">INTELLIGENCE</text>
      <text y="493" font-size="22" fill="#121B2D">Parallel + Gemini + ADK</text>
    </g>

    <g transform="translate(1328 542)">
      <text font-size="20" font-weight="700" letter-spacing="3" fill="#3154D5">03  PRODUCE</text>
      <circle cx="70" cy="148" r="62" fill="#EEF2FF"/>
      <rect x="28" y="112" width="84" height="58" rx="8" fill="none" stroke="#3154D5" stroke-width="6"/>
      <path d="M58 126L88 141L58 157Z" fill="#3154D5"/>
      <path d="M46 184H94M70 170V184" stroke="#3154D5" stroke-width="6" stroke-linecap="round"/>
      <circle cx="111" cy="108" r="18" fill="#FF6666"/>
      <circle cx="111" cy="108" r="6" fill="#FFFFFF"/>
      <text y="270" font-size="38" font-weight="700" fill="#121B2D">Build the video</text>
      <text y="319" font-size="23" fill="#5D687D">Record real interactions, narrate,</text>
      <text y="354" font-size="23" fill="#5D687D">caption, frame, zoom, and render.</text>
      <line x1="0" y1="404" x2="416" y2="404" stroke="#DCE3EF" stroke-width="2"/>
      <text y="452" font-size="19" font-weight="700" letter-spacing="2" fill="#7A8496">PRODUCTION</text>
      <text y="493" font-size="22" fill="#121B2D">Playwright + TTS + FFmpeg</text>
    </g>

    <g transform="translate(1904 542)">
      <text font-size="20" font-weight="700" letter-spacing="3" fill="#3154D5">04  DELIVER</text>
      <circle cx="70" cy="148" r="62" fill="#EEF2FF"/>
      <path d="M35 150L62 177L108 119" fill="none" stroke="#3154D5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="111" cy="108" r="18" fill="#34A853"/>
      <text y="270" font-size="38" font-weight="700" fill="#121B2D">Review and share</text>
      <text y="319" font-size="23" fill="#5D687D">Adjust the result, download MP4,</text>
      <text y="354" font-size="23" fill="#5D687D">or publish privately to YouTube.</text>
      <line x1="0" y1="404" x2="480" y2="404" stroke="#DCE3EF" stroke-width="2"/>
      <text y="452" font-size="19" font-weight="700" letter-spacing="2" fill="#7A8496">OUTPUTS</text>
      <text y="493" font-size="22" fill="#121B2D">Presentation · Product · Spotlight · Short</text>
    </g>
  </g>

  <path d="M640 794H692" stroke="#3154D5" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1216 794H1268" stroke="#3154D5" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1792 794H1844" stroke="#3154D5" stroke-width="4" marker-end="url(#arrow)"/>

  <line x1="128" y1="1232" x2="2432" y2="1232" stroke="#CBD5E7" stroke-width="2"/>
  <text x="128" y="1296" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="2" fill="#3154D5">VEYFRAME</text>
  <text x="2432" y="1296" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="21" fill="#5D687D">Grounded planning · deterministic execution · editable output</text>
</svg>
