<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
  <title id="title">Veyframe Google Cloud architecture</title>
  <desc id="desc">The deployed Veyframe architecture showing browser clients, Cloud Run services, Google ADK and Gemini orchestration, direct Parallel Search, Cloud Tasks, production workers, persistent data, and delivery.</desc>
