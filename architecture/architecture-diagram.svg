    <text x="92" y="154" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#172033">From authenticated brief to durable video export</text>
    <text x="92" y="205" font-size="23" fill="#697386">Actual runtime boundary · direct partner research · typed AI plans · deterministic media execution</text>

