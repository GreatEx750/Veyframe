[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["packages/contracts/tests", "services/api/tests", "services/worker/tests"]
pythonpath = ["packages/contracts/python", "services/api/src", "services/worker/src"]
markers = ["live: opt-in tests that call paid external services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["packages/contracts/python", "services/api/src", "services/worker/src"]
