[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "demodirector-worker"
version = "0.1.0"
description = "DemoDirector background worker"
requires-python = ">=3.12"
dependencies = [
  "demodirector-contracts>=0.1.0",
  "fastapi>=0.116.1,<1",
  "google-cloud-storage>=3.3.0,<4",
  "google-genai>=2.21.0,<3",
  "playwright>=1.55.0,<2",
  "pydantic>=2.11.7,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
