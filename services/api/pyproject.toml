[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "demodirector-api"
version = "0.1.0"
description = "DemoDirector application API"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50.0.1,<51",
  "demodirector-contracts>=0.1.0",
  "demodirector-worker>=0.1.0",
  "fastapi>=0.116.1,<1",
  "google-adk>=2.8.0,<3",
  "google-genai>=2.21.0,<3",
  "google-cloud-firestore>=2.21.0,<3",
  "google-cloud-storage>=3.3.0,<4",
  "google-cloud-tasks>=2.19.3,<3",
  "httpx>=0.28.1,<1",
  "parallel-web>=1.3.3,<2",
  "pydantic>=2.11.7,<3",
  "python-dotenv>=1.2.1,<2",
  "uvicorn[standard]>=0.35.0,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
